# TP19 partie 2 : première Application Argo CD (environnement dev uniquement).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Amal356/tp19-gitops.git
    targetRevision: main
    path: envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # COMPLÉTÉ (partie 3) : synchronisation automatique
    automated:
      prune: true     # une ressource supprimée de Git est supprimée du cluster
      selfHeal: true  # une modification faite à la main dans le cluster est annulée
